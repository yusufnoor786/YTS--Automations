name: Post videos

on:
  schedule:
    # Backup only. The real timer is the "heartbeat" job below: every run starts the next one
    # 30 min later, because GitHub's cron is often hours late / skipped on new repos.
    # The Growth Lab decides which hours actually post; other runs just refresh the counts.
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      niche:
        description: "Only this niche (aesthetic / gta / horror). Empty = all"
        required: false
        default: ""
      dry_run:
        description: "Dry run — prepare everything but don't publish"
        type: boolean
        default: false
      force:
        description: "Ignore today's posts_per_day limit (posts 1 more)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: yts-state
      cancel-in-progress: false
    env:
      YTS_TZ: Asia/Kolkata
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_TOKEN_AESTHETIC: ${{ secrets.IG_TOKEN_AESTHETIC }}
      IG_ID_AESTHETIC: ${{ secrets.IG_ID_AESTHETIC }}
      IG_TOKEN_GTA: ${{ secrets.IG_TOKEN_GTA }}
      IG_ID_GTA: ${{ secrets.IG_ID_GTA }}
      IG_TOKEN_HORROR: ${{ secrets.IG_TOKEN_HORROR }}
      IG_ID_HORROR: ${{ secrets.IG_ID_HORROR }}
      IG_TOKEN_COMEDY: ${{ secrets.IG_TOKEN_COMEDY }}
      IG_ID_COMEDY: ${{ secrets.IG_ID_COMEDY }}
      FB_TOKEN_AESTHETIC: ${{ secrets.FB_TOKEN_AESTHETIC }}
      FB_PAGE_ID_AESTHETIC: ${{ secrets.FB_PAGE_ID_AESTHETIC }}
      FB_TOKEN_GTA: ${{ secrets.FB_TOKEN_GTA }}
      FB_PAGE_ID_GTA: ${{ secrets.FB_PAGE_ID_GTA }}
      FB_TOKEN_HORROR: ${{ secrets.FB_TOKEN_HORROR }}
      FB_PAGE_ID_HORROR: ${{ secrets.FB_PAGE_ID_HORROR }}
      FB_TOKEN_COMEDY: ${{ secrets.FB_TOKEN_COMEDY }}
      FB_PAGE_ID_COMEDY: ${{ secrets.FB_PAGE_ID_COMEDY }}
      YT_TOKEN_AESTHETIC: ${{ secrets.YT_TOKEN_AESTHETIC }}
      YT_TOKEN_GTA: ${{ secrets.YT_TOKEN_GTA }}
      YT_TOKEN_HORROR: ${{ secrets.YT_TOKEN_HORROR }}
      YT_TOKEN_COMEDY: ${{ secrets.YT_TOKEN_COMEDY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always the newest state, even when this run waited in the queue
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q -r requirements.txt
      - name: Post
        env:
          IN_NICHE: ${{ inputs.niche }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          ARGS=()
          [ -n "$IN_NICHE" ] && ARGS+=(--niche "$IN_NICHE")
          [ "$IN_DRY" = "true" ] && ARGS+=(--dry-run)
          [ "$IN_FORCE" = "true" ] && ARGS+=(--force)
          python -m autopilot.post "${ARGS[@]}"
      - name: Refresh followers, views & dashboard
        if: always()
        timeout-minutes: 8
        run: python -m autopilot.analytics || python -m autopilot.dashboard
      - name: Save state & dashboard
        if: always()
        run: |
          git config user.name "yts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs; for f in TRENDS.md GROWTH_LOG.md; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -q -m "bot: update state [skip ci]"
          for i in 1 2 3 4; do git pull -q --rebase --autostash -X theirs && git push -q && exit 0; sleep $((i*5)); done
          exit 1

  # Starts Niche research when due, then waits for the next 15-minute slot and starts the next
  # post run. Only one heartbeat lives at a time: a newer one cancels the older sleeping one.
  heartbeat:
    needs: post
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: yts-heartbeat
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            autopilot
            state
      - name: Start analytics / research if due
        run: |
          for wf in $(python3 -m autopilot.heartbeat due); do
            echo "due: $wf"; gh workflow run "$wf" --ref main || echo "::warning::could not start $wf"
          done
      - name: Wait for the next slot, then start the next post run
        run: |
          s=$(python3 -m autopilot.heartbeat sleep)
          echo "next post run in $((s/60)) min"
          sleep "$s"
          for i in 1 2 3 4 5; do gh workflow run post.yml --ref main && exit 0; sleep 20; done
          exit 1

